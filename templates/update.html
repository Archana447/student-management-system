<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-body">

            <h2 class="mb-4">✏️ Update Student</h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Student ID</label>
                    <input type="text"
                           class="form-control"
                           value="{{ student[0] }}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text"
                           class="form-control"
                           name="name"
                           value="{{ student[1] }}"
                           required>
                </div>
                <div class="mb-3">
    <label class="form-label">Course</label>
    <input type="text"
           class="form-control"
           name="course"
           value="{{ student[2] }}"
           required>
</div>

              <div class="mb-3">
    <label class="form-label">CGPA</label>
    <input type="number"
           step="0.01"
           min="0"
           max="10"
           class="form-control"
           name="cgpa"
           value="{{ student[4] }}"
           required>
</div>

                <button type="submit" class="btn btn-primary">
                    Update Student
                </button>

                <a href="/" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
